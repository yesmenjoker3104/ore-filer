name: Build Windows executable

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip; python -m pip install . pyinstaller

      - name: Check Python sources
        run: python -m compileall -q ore_filer

      - name: Build executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name ore-filer
          --add-data "ore_filer/icon.jpg;ore_filer"
          ore_filer/app.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ore-filer-windows
          path: dist/ore-filer.exe
          if-no-files-found: error
