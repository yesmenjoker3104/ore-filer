[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ore-filer"
version = "0.1.0"
description = "Windows向けキーボード操作中心の2画面ファイラー"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "pyzipper>=0.3.6,<1",
    "py7zr>=1.1,<2",
]

[tool.setuptools.packages.find]
include = ["ore_filer*"]

[tool.setuptools.package-data]
ore_filer = ["icon.jpg"]
